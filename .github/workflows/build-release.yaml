name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Read and validate version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="openrisk-v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "::error title=Release tag already exists::Bump package.json before releasing. ${tag} already exists."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Tauri (${{ matrix.platform }})
    needs: release-metadata
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          # FIXME: remove for now
          # - platform: 'macos-latest' # for Intel based macs.
          #   args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-2022'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: release-${{ matrix.platform }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: openrisk-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'OpenRisk v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-native-macos:
    name: Native macOS (Apple silicon)
    needs: [release-metadata, publish-tauri]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: release-native-macos-arm64

      - name: Install dependencies
        run: npm ci

      - name: Build native macOS app
        run: npm run native:macos -- --release

      - name: Archive native app
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          archive="OpenRisk-native-macos-arm64-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/native-macos/OpenRisk.app \
            "$archive"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRisk-native-macos-arm64-v${{ needs.release-metadata.outputs.version }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Upload native app to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
