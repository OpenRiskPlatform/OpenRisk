name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact next version (for example 2.1.0). Leave empty to bump minor."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Wrong branch::Run the manual release workflow from main."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Bump and commit application version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          current_version="$(node -p "require('./package.json').version")"
          requested_version="$(echo "$REQUESTED_VERSION" | xargs)"

          if [[ -n "$requested_version" ]]; then
            if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Invalid version::Use an exact stable SemVer such as 2.1.0."
              exit 1
            fi

            IFS=. read -r current_major current_minor current_patch <<< "$current_version"
            IFS=. read -r next_major next_minor next_patch <<< "$requested_version"
            if (( next_major < current_major ||
                  (next_major == current_major && next_minor < current_minor) ||
                  (next_major == current_major && next_minor == current_minor && next_patch <= current_patch) )); then
              echo "::error title=Version must increase::Current version is ${current_version}; requested ${requested_version}."
              exit 1
            fi
            version_argument="$requested_version"
          else
            version_argument="minor"
          fi

          npm run version:app -- "$version_argument"

          version="$(node -p "require('./package.json').version")"
          tag="openrisk-v${version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "::error title=Release already exists::Tag ${tag} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${version}"
          git push origin HEAD:main

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Tauri (${{ matrix.platform }})
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-2022
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: release-${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run build:app --
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: OpenRisk v${{ needs.prepare-release.outputs.version }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub release
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
