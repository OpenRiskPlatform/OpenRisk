[workspace]
members = [
  ".",
  "crates/openrisk-core",
  "crates/openrisk-uniffi",
  "tools/uniffi-bindgen",
]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["OpenRiskPlatform"]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1"
jsonschema = "0.18"
libsqlite3-sys = { version = "0.30", features = [
  "bundled-sqlcipher-vendored-openssl",
] }
once_cell = "1.21"
regress = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-native-roots",
  "json",
] }
rustyscript = { version = "0.12.3", features = [
  "safe_extensions",
  "http",
  "fs_import",
] }
serde = "=1.0.219"
serde_json = "=1.0.120"
specta = { version = "=2.0.0-rc.24", features = ["derive", "serde_json"] }
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "migrate",
  "macros",
  "derive",
] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync"] }
uniffi = { version = "0.32.0", default-features = false }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[package]
name = "openrisk-tauri"
version.workspace = true
description = "OpenRisk Tauri desktop adapter"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "openrisk"

[lib]
name = "openrisk_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openrisk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openrisk-core = { path = "crates/openrisk-core" }
specta.workspace = true
specta-typescript = "0.0.11"
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.6.2"
tauri-plugin-fs = "2"
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3.1"
tauri-plugin-store = "2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
tokio.workspace = true
